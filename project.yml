name: ShoppingList
options:
  bundleIdPrefix: dev.xires
  deploymentTarget:
    iOS: "17.0"

packages:
  ShoppingListKit:
    path: Packages/ShoppingListKit

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES

targets:
  ShoppingList:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: ShoppingListKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.xires.ShoppingList
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Einkaufsliste
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait

  ShoppingListTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: ShoppingList
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.xires.ShoppingListTests

  ShoppingListUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: ShoppingList
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.xires.ShoppingListUITests

schemes:
  ShoppingList:
    build:
      targets:
        ShoppingList: all
    test:
      targets:
        - ShoppingListTests
        - ShoppingListUITests
